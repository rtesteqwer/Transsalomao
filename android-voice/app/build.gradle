plugins {
    id 'com.android.application'
}

android {
    namespace 'com.transsalomao.voice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.transsalomao.voice'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '5.3.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
