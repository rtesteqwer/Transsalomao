name: Inspect reconstructed auth

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source only
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Inspect auth logout render references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== AUTH FILES ==='
          find /tmp/trans-source/src -type f \( -iname '*auth*' -o -iname '*login*' \) -print
          echo '=== MANAGEMENT AUTH ==='
          for f in /tmp/trans-source/src/lib/management-auth* /tmp/trans-source/src/**/management-auth*; do
            [ -f "$f" ] || continue
            echo "--- $f"
            sed -n '1,260p' "$f"
          done
          echo '=== RENDER REFERENCES ==='
          grep -RniE 'onrender|render\.com|transteste|RENDER' /tmp/trans-source/src /tmp/trans-source/public || true
          echo '=== LOGOUT REFERENCES ==='
          grep -RniE 'logout|signOut|sair|location\.(href|assign|replace)|window\.location' /tmp/trans-source/src | head -300 || true
          echo '=== ADMIN CREDENTIAL REFERENCES ==='
          grep -RniE 'admin|Felipe|Emanuel|Murillo|159753|8554|10203040' /tmp/trans-source/src | head -400 || true
