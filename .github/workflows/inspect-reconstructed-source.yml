name: Inspect report API shapes

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Dump report API shapes
        shell: bash
        run: |
          set -euo pipefail
          echo '=== USE FLEET ==='
          sed -n '1,135p' /tmp/trans-source/src/lib/use-fleet.ts
          echo '=== API REPORTS 300-430 ==='
          sed -n '300,430p' /tmp/trans-source/src/lib/api.ts
          echo '=== API TRIPS 450-530 ==='
          sed -n '450,535p' /tmp/trans-source/src/lib/api.ts
          echo '=== TYPES REPORT ==='
          grep -n -A40 -B10 'DriverReport' /tmp/trans-source/src/lib/types.ts
      - name: Compile final source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
