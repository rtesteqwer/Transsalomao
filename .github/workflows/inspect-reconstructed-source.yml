name: Validate freight prices build

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reconstructed application
        run: node bootstrap.mjs
      - name: Inspect expenses and commissions
        shell: bash
        run: |
          SRC="$(ls -dt /tmp/transsalomao-build-* | head -1)"
          echo '=== DESPESAS ==='
          sed -n '1,320p' "$SRC/src/routes/dono/despesas.tsx" || true
          echo '=== TYPES expense/report/driver ==='
          grep -n -E -C 8 'Expense|expense|Despesa|despesa|commission|Commission|comissao|comissão|Driver|driver' "$SRC/src/lib/types.ts" || true
          echo '=== API expense/report/commission ==='
          grep -n -E -C 12 'expense|Expense|despesa|Despesa|commission|Commission|comissao|comissão|report|Report' "$SRC/src/lib/api.ts" || true
          echo '=== CALC commission ==='
          grep -n -E -C 12 'commission|Commission|comissao|comissão|expense|despesa|driver' "$SRC/src/lib/calc.ts" || true
          echo '=== TOTAIS commission/driver ==='
          grep -n -E -C 12 'commission|Commission|comissao|comissão|expense|despesa|driver|motorista' "$SRC/src/routes/dono/totais.tsx" || true
          echo '=== DRIVER REPORT/PDF/XLSX references ==='
          grep -R -n -E -C 8 'commission|Commission|comissao|comissão|expense|despesa|driverCommission|commissionValue' "$SRC/src" | head -1200 || true
          echo 'INSPECTION_OK'
