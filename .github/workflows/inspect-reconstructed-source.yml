name: Inspect all PDF and Excel generators

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Inspect all report generators
        shell: bash
        run: |
          set -euo pipefail
          echo '=== GENERATOR FILES ==='
          grep -RliE 'exceljs|jsPDF|downloadDriverReportPdf|REPORT_LOGO_JPEG' /tmp/trans-source/src | sort || true
          echo '=== GENERATOR REFERENCES ==='
          grep -RniE 'exceljs|jsPDF|downloadDriverReportPdf|REPORT_LOGO_JPEG|operatorName|fontSize|font =|textColor|headStyles' /tmp/trans-source/src/routes/dono /tmp/trans-source/src/routes/klebersom.tsx /tmp/trans-source/src/lib/pdf.ts | head -1600 || true
          echo '=== DONO INDEX 1-240 ==='
          sed -n '1,240p' /tmp/trans-source/src/routes/dono/index.tsx
          echo '=== KLEBERSOM GENERATORS ==='
          grep -nE 'exceljs|jsPDF|REPORT_LOGO_JPEG|font|textColor|operator|PDF|Excel' /tmp/trans-source/src/routes/klebersom.tsx | head -800 || true
