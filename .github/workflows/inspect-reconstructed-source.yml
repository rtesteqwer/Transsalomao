name: Inspect exact report sections

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source only
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Print exact sections
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TYPES 1-100 ==='; sed -n '1,110p' /tmp/trans-source/src/lib/types.ts
          echo '=== API 80-130 ==='; sed -n '80,135p' /tmp/trans-source/src/lib/api.ts
          echo '=== API 320-415 ==='; sed -n '320,420p' /tmp/trans-source/src/lib/api.ts
          echo '=== MOTORISTA 55-255 ==='; sed -n '55,255p' /tmp/trans-source/src/routes/motorista.tsx
          echo '=== LANCAMENTOS 150-220 ==='; sed -n '150,225p' /tmp/trans-source/src/routes/dono/lancamentos.tsx
          echo '=== PDF 450-740 ==='; sed -n '450,745p' /tmp/trans-source/src/lib/pdf.ts
          echo '=== TOTALS 190-245 ==='; sed -n '190,250p' /tmp/trans-source/src/routes/dono/totais.tsx
