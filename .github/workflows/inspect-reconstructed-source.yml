name: Validate freight prices build

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reconstructed application
        run: node bootstrap.mjs
      - name: Inspect driver launch and trips table
        shell: bash
        run: |
          SRC="$(ls -dt /tmp/transsalomao-build-* | head -1)"
          echo '--- VIAGENS ---'
          grep -n -E -C 8 'Diesel|diesel|Preço|preço|Tonel|tonel|pricePerTon|freightMode' "$SRC/src/routes/dono/viagens.tsx" || true
          echo '--- MOTORISTA ---'
          grep -n -E -C 10 'freight|Frete|frete|mode|Modo|modo|ton|Ton|trip|Viagem|viagem|report' "$SRC/src/routes/motorista.tsx" || true
          echo '--- LANCAMENTOS ---'
          grep -n -E -C 8 'freight|Frete|frete|mode|Modo|modo|ton|Ton|trip|Viagem|viagem|report' "$SRC/src/routes/dono/lancamentos.tsx" || true
          echo 'INSPECTION_OK'
