name: Validate report visual reform

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Validate requested report changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'format: "a3"' /tmp/trans-source/src/lib/pdf.ts
          grep -q 'width: 520, height: 260' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'width: 520, height: 260' /tmp/trans-source/src/routes/dono/viagens.tsx
          grep -q 'const lightBlue = "DCEEFF"' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'const excelLightBlue = "DCEEFF"' /tmp/trans-source/src/routes/dono/viagens.tsx
          grep -q 'FileSpreadsheet' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'Gerar Excel de ${d.driverName}' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'exportExcelColorido({ id: d.driverId, name: d.driverName })' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'driverScope ? computed.filter' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'filter((d: any) => !driverScope' /tmp/trans-source/src/routes/dono/totais.tsx
          grep -q 'fontSize: 16' /tmp/trans-source/src/lib/pdf.ts
          grep -q 'Operador: ${resolvedOperatorName}' /tmp/trans-source/src/lib/pdf.ts
          grep -q 'excelOperator' /tmp/trans-source/src/routes/dono/totais.tsx
          if sed -n '437,730p' /tmp/trans-source/src/lib/pdf.ts | grep -q 'Resultado bruto'; then echo 'Resultado bruto ainda existe no PDF atual' >&2; exit 1; fi
          if grep -R 'operatorName: "admin"' /tmp/trans-source/src/routes/dono; then echo 'Operador admin fixo ainda existe' >&2; exit 1; fi
      - name: Compile final source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
