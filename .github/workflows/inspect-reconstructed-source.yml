name: Validate freight prices build

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reconstructed application
        run: node bootstrap.mjs
      - name: Verify feature markers
        shell: bash
        run: |
          SRC="$(ls -dt /tmp/transsalomao-build-* | head -1)"
          grep -q 'upsertFreightPrices' "$SRC/src/lib/api.ts"
          grep -q 'update trips set price_per_trip' "$SRC/src/lib/api.ts"
          grep -q 'Preços frete' "$SRC/src/routes/dono/cadastros.tsx"
          grep -q 'Preço automático' "$SRC/src/components/owner/trip-form.tsx"
          test -f "$SRC/migrations/0007_freight_prices.sql"
          echo 'FREIGHT_PRICES_BUILD_OK'
