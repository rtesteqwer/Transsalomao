name: Inspect daily close flow

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source only
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Print daily close sections
        shell: bash
        run: |
          set -euo pipefail
          echo '=== LANCAMENTOS 1-155 ==='; sed -n '1,155p' /tmp/trans-source/src/routes/dono/lancamentos.tsx
          echo '=== LANCAMENTOS 220-340 ==='; sed -n '220,340p' /tmp/trans-source/src/routes/dono/lancamentos.tsx
          echo '=== TRIP FORM 1-190 ==='; sed -n '1,190p' /tmp/trans-source/src/components/owner/trip-form.tsx
          echo '=== TRIP FORM 190-360 ==='; sed -n '190,360p' /tmp/trans-source/src/components/owner/trip-form.tsx
