name: Validate operational UI changes

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'whatsapp-v1/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test WhatsApp ingestion
        run: node --test whatsapp-v1/webhook.test.mjs
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Validate requested changes
        shell: bash
        run: |
          set -euo pipefail
          MOTORISTA=/tmp/trans-source/src/routes/motorista.tsx
          CAIXA=/tmp/trans-source/src/routes/dono/lancamentos.tsx
          VIAGENS=/tmp/trans-source/src/routes/dono/viagens.tsx
          FUEL=/tmp/trans-source/src/routes/dono/abastecimentos.tsx
          API=/tmp/trans-source/src/lib/api.ts
          HOOK=/tmp/trans-source/src/lib/use-fleet.ts

          # The AI ticket reader intentionally has a review field called "Número do ticket".
          # Only fail if the legacy manual ticket state/form is still present.
          if grep -q 'const \[ticket, setTicket\]' "$MOTORISTA"; then echo 'Estado manual de ticket ainda existe' >&2; exit 1; fi
          grep -q 'ticket: ""' "$MOTORISTA"
          grep -q 'TicketPhotoAccess' "$MOTORISTA"
          grep -q 'Foto do ticket / documento da viagem' "$MOTORISTA"

          grep -q 'updatePendingReport' "$API"
          grep -q "status = 'pendente'" "$API"
          grep -q 'editReport' "$HOOK"
          grep -q 'Editar lançamento' "$CAIXA"
          grep -q 'Salvar edição' "$CAIXA"
          grep -q 'Selecionar todos' "$CAIXA"
          grep -q 'type="checkbox"' "$CAIXA"

          grep -q 'Peso líquido' "$VIAGENS"
          grep -q 'Preço por tonelada' "$VIAGENS"
          grep -q 'Frete total' "$VIAGENS"
          grep -q 'Comissão' "$VIAGENS"
          grep -q 'brl(trip.pricePerTon)' "$VIAGENS"
          grep -q 'brl(trip.commissionValue)' "$VIAGENS"

          if grep -q 'KM entre abastecimentos' "$FUEL"; then echo 'KM entre abastecimentos ainda existe' >&2; exit 1; fi
          if grep -q 'Média KM/L' "$FUEL"; then echo 'Média KM/L ainda existe' >&2; exit 1; fi
          if grep -q 'label="KM rodado"' "$FUEL"; then echo 'KM rodado derivado ainda existe' >&2; exit 1; fi
          if grep -q 'label="KM/L"' "$FUEL"; then echo 'KM/L derivado ainda existe' >&2; exit 1; fi
          echo 'Operational UI assertions passed.'
      - name: Inspect generated API acceptance block
        shell: bash
        run: |
          set -euo pipefail
          nl -ba /tmp/trans-source/src/lib/api.ts | sed -n '145,180p'

      - name: Inspect trip report schema for safe recovery
        shell: bash
        run: |
          set -euo pipefail
          echo '--- schema files ---'
          find /tmp/trans-source -maxdepth 4 -type f \( -name '*.sql' -o -name '*schema*' -o -name '*migrat*' \) | sort | head -120
          echo '--- trips/reports definitions ---'
          grep -RniE 'create table.*(trips|reports)|created_at|trip_id' /tmp/trans-source --include='*.sql' --include='*.ts' --include='*.mjs' | head -220 || true
          echo '--- core trip/report schema ---'
          sed -n '1,65p' /tmp/trans-source/migrations/0002_schema.sql
          echo '--- freight/report extensions ---'
          cat /tmp/trans-source/migrations/0003_freight_mode.sql
          cat /tmp/trans-source/migrations/0004_driver_reports_and_fuelings.sql
          cat /tmp/trans-source/migrations/0005_cegonha_caixinha_despesas.sql
          cat /tmp/trans-source/migrations/0006_motorista_campos_opcionais.sql

      - name: Compile final source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Test ticket photo flows
        shell: bash
        run: |
          set -euo pipefail
          TRANS_TEST_APP=/tmp/trans-source node --test tests/ticket-reader.test.mjs tests/tickets.test.mjs

