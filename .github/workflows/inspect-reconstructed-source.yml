name: Inspect operational UI targets

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Inspect requested UI targets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DRIVER/LANCAMENTO TICKET ==='
          grep -RniE 'ticket|Ticket|freightMode|Diária|Por tonelada|Por Tonelada' /tmp/trans-source/src/routes/motorista* /tmp/trans-source/src/components 2>/dev/null | head -350 || true
          echo '=== CAIXA ==='
          grep -RniE 'Caixa|Selecion|Editar|edit|checkbox|selected|Fechar viagem|Lançar no painel' /tmp/trans-source/src/routes/dono /tmp/trans-source/src/components 2>/dev/null | head -500 || true
          echo '=== VIAGENS CARDS ==='
          grep -RniE 'Por tonelada|Por Tonelada|netWeight|pricePerTon|commissionValue|Frete|Comissão|compactRows' /tmp/trans-source/src/routes/dono/viagens.tsx 2>/dev/null | head -450 || true
          echo '=== ABASTECIMENTOS ==='
          grep -RniE 'KM entre|km entre|Média|Media|KM/L|km/l|kmPerLiter|kmDriven|abastec' /tmp/trans-source/src/routes/dono/abastecimentos.tsx /tmp/trans-source/src/routes/dono 2>/dev/null | head -450 || true
          echo '=== TARGET FILES ==='
          find /tmp/trans-source/src/routes -maxdepth 3 -type f | sort | grep -E 'motorista|lancamentos|caixa|viagens|abastecimentos' || true
      - name: Compile final source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
