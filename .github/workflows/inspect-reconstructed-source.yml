name: Validate operational UI changes

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'whatsapp-v1/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test WhatsApp ingestion
        run: node --test whatsapp-v1/webhook.test.mjs
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Inspect TanStack dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          echo '--- reconstructed package.json ---'
          cat /tmp/trans-source/package.json
          echo '--- lockfile TanStack entries ---'
          if [ -f /tmp/trans-source/package-lock.json ]; then
            node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('/tmp/trans-source/package-lock.json','utf8'));
          const p = lock.packages || {};
          for (const [k,v] of Object.entries(p)) {
            if (k.includes('@tanstack/react-start') || k.includes('@tanstack/start-server-core')) {
              console.log(k, v.version, v.resolved || '');
            }
          }
          NODE
          else
            echo 'NO PACKAGE LOCK'
          fi

      - name: Inspect report download implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '--- PDF download function ---'
          grep -nE 'downloadDriverReportPdf|\.save\(|output\(|Blob|createObjectURL|download' /tmp/trans-source/src/lib/pdf.ts | head -160 || true
          echo '--- Excel download tail ---'
          tail -n 90 /tmp/trans-source/src/lib/excel-report.ts

      - name: Inspect trip creation ordering paths
        shell: bash
        run: |
          set -euo pipefail
          echo '--- trip insert/update/query paths ---'
          grep -nE 'insert into trips|update trips set|select \* from trips|created_at|acceptReports|saveTrip|upsertTrip' /tmp/trans-source/src/lib/api.ts | head -260 || true
          echo '--- contexts around trip inserts ---'
          grep -n 'insert into trips' /tmp/trans-source/src/lib/api.ts | cut -d: -f1 | while read -r line; do
            start=$((line>18 ? line-18 : 1)); end=$((line+38));
            echo "### lines $start-$end"
            sed -n "${start},${end}p" /tmp/trans-source/src/lib/api.ts
          done

      - name: Validate requested changes
        shell: bash
        run: |
          set -euo pipefail
          MOTORISTA=/tmp/trans-source/src/routes/motorista.tsx
          CAIXA=/tmp/trans-source/src/routes/dono/lancamentos.tsx
          VIAGENS=/tmp/trans-source/src/routes/dono/viagens.tsx
          FUEL=/tmp/trans-source/src/routes/dono/abastecimentos.tsx
          API=/tmp/trans-source/src/lib/api.ts
          HOOK=/tmp/trans-source/src/lib/use-fleet.ts

          # The AI ticket reader intentionally has a review field called "Número do ticket".
          # Only fail if the legacy manual ticket state/form is still present.
          if grep -q 'const \[ticket, setTicket\]' "$MOTORISTA"; then echo 'Estado manual de ticket ainda existe' >&2; exit 1; fi
          grep -q 'ticket: ""' "$MOTORISTA"
          grep -q 'TicketPhotoAccess' "$MOTORISTA"
          grep -q 'Foto do ticket / documento da viagem' "$MOTORISTA"

          grep -q 'updatePendingReport' "$API"
          grep -q "status = 'pendente'" "$API"
          grep -q 'editReport' "$HOOK"
          grep -q 'Editar lançamento' "$CAIXA"
          grep -q 'Salvar edição' "$CAIXA"
          grep -q 'Selecionar todos' "$CAIXA"
          grep -q 'type="checkbox"' "$CAIXA"

          grep -q 'Peso líquido' "$VIAGENS"
          grep -q 'Preço por tonelada' "$VIAGENS"
          grep -q 'Frete total' "$VIAGENS"
          grep -q 'Comissão' "$VIAGENS"
          grep -q 'brl(trip.pricePerTon)' "$VIAGENS"
          grep -q 'brl(trip.commissionValue)' "$VIAGENS"

          if grep -q 'KM entre abastecimentos' "$FUEL"; then echo 'KM entre abastecimentos ainda existe' >&2; exit 1; fi
          if grep -q 'Média KM/L' "$FUEL"; then echo 'Média KM/L ainda existe' >&2; exit 1; fi
          if grep -q 'label="KM rodado"' "$FUEL"; then echo 'KM rodado derivado ainda existe' >&2; exit 1; fi
          if grep -q 'label="KM/L"' "$FUEL"; then echo 'KM/L derivado ainda existe' >&2; exit 1; fi
          echo 'Operational UI assertions passed.'
      - name: Inspect generated API acceptance block
        shell: bash
        run: |
          set -euo pipefail
          nl -ba /tmp/trans-source/src/lib/api.ts | sed -n '145,180p'

      - name: Inspect trip report schema for safe recovery
        shell: bash
        run: |
          set -euo pipefail
          echo '--- schema files ---'
          find /tmp/trans-source -maxdepth 4 -type f \( -name '*.sql' -o -name '*schema*' -o -name '*migrat*' \) | sort | head -120
          echo '--- trips/reports definitions ---'
          grep -RniE 'create table.*(trips|reports)|created_at|trip_id' /tmp/trans-source --include='*.sql' --include='*.ts' --include='*.mjs' | head -220 || true
          echo '--- core trip/report schema ---'
          sed -n '1,65p' /tmp/trans-source/migrations/0002_schema.sql
          echo '--- freight/report extensions ---'
          cat /tmp/trans-source/migrations/0003_freight_mode.sql
          cat /tmp/trans-source/migrations/0004_driver_reports_and_fuelings.sql
          cat /tmp/trans-source/migrations/0005_cegonha_caixinha_despesas.sql
          cat /tmp/trans-source/migrations/0006_motorista_campos_opcionais.sql

      - name: Upload reconstructed source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-source
          path: |
            /tmp/trans-source/src/routes/dono/lancamentos.tsx
            /tmp/trans-source/src/routes/dono/viagens.tsx
            /tmp/trans-source/src/routes/dono/abastecimentos.tsx
            /tmp/trans-source/src/routes/dono/despesas.tsx
            /tmp/trans-source/src/lib/api.ts
            /tmp/trans-source/src/lib/types.ts
            /tmp/trans-source/src/lib/use-fleet.ts
          retention-days: 1

      - name: Compile final source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Inspect built TanStack versions
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          echo '--- installed package versions ---'
          node -e "console.log('react-start', require('./node_modules/@tanstack/react-start/package.json').version); console.log('start-server-core', require('./node_modules/@tanstack/start-server-core/package.json').version)"
          echo '--- every installed @tanstack/react-start copy ---'
          find node_modules -type f -path '*/@tanstack/react-start/package.json' -print -exec node -e "const p=require('./{}'); console.log(p.name,p.version)" \; || true
          echo '--- npm dependency tree for react-start ---'
          npm ls @tanstack/react-start @tanstack/start-server-core --all || true
          echo '--- vulnerable version references in generated Vercel output ---'
          grep -RIl --binary-files=without-match '1\.168\.49' .vercel/output | head -100 || true
          echo '--- react-start references in generated package manifests ---'
          find .vercel/output -type f -name 'package.json' -print0 | xargs -0 grep -HnE '@tanstack/react-start|@tanstack/start-server-core|1\.168\.49|1\.168\.60|1\.169\.39' || true

      - name: Test ticket photo flows
        shell: bash
        run: |
          set -euo pipefail
          TRANS_TEST_APP=/tmp/trans-source node --test tests/ticket-reader.test.mjs tests/tickets.test.mjs

