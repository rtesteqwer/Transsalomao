name: Inspect operational source blocks

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Dump exact source blocks
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MOTORISTA 1-340 ==='
          sed -n '1,340p' /tmp/trans-source/src/routes/motorista.tsx
          echo '=== LANCAMENTOS 1-340 ==='
          sed -n '1,340p' /tmp/trans-source/src/routes/dono/lancamentos.tsx
          echo '=== VIAGENS 240-550 ==='
          sed -n '240,550p' /tmp/trans-source/src/routes/dono/viagens.tsx
          echo '=== ABASTECIMENTOS 1-180 ==='
          sed -n '1,180p' /tmp/trans-source/src/routes/dono/abastecimentos.tsx
          echo '=== HOOK REPORT MUTATIONS ==='
          grep -RniE 'use.*Report|update.*Report|report.*mutat|acceptReport|removeReport|pendingReports|useFleetData|useReports' /tmp/trans-source/src | head -500 || true
      - name: Compile final source
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/trans-source
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
