name: Inspect reconstructed source

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source
        run: |
          node bootstrap.mjs
          SRC="$(ls -dt /tmp/transsalomao-build-* | head -1)"
          mkdir -p inspect-src/src inspect-src/migrations
          cp -r "$SRC/src/lib" inspect-src/src/lib
          cp -r "$SRC/src/components/owner" inspect-src/src/owner-components
          cp -r "$SRC/src/routes/dono" inspect-src/src/dono-routes
          cp "$SRC/src/routes/motorista.tsx" inspect-src/src/motorista.tsx || true
          cp -r "$SRC/migrations/." inspect-src/migrations/
          cp "$SRC/package.json" inspect-src/package.json
          cp "$SRC/scripts/migrate.mjs" inspect-src/migrate.mjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-source
          path: inspect-src
          retention-days: 1
