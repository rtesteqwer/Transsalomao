name: Inspect freight and reports

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source only
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Inspect freight modes and reports
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FREIGHT MODE REFERENCES ==='
          grep -RniE 'Por viagem|por viagem|fixed|freightMode|freight_mode|modo.*frete|mode.*freight|Cegonha|Caixinha' /tmp/trans-source/src | head -500 || true
          echo '=== MOTORISTA ROUTE ==='
          sed -n '1,360p' /tmp/trans-source/src/routes/motorista.tsx || true
          echo '=== TRIP FORM ==='
          sed -n '1,360p' /tmp/trans-source/src/components/trip-form.tsx || true
          echo '=== API REPORT/TRIP SECTIONS ==='
          grep -nE 'createReport|report|freight|commission|gross|net|tons|pricePerTon|fixed' /tmp/trans-source/src/lib/api.ts | head -500 || true
          echo '=== CALC ==='
          sed -n '1,360p' /tmp/trans-source/src/lib/calc.ts || true
          echo '=== GENERAL PDF RELEVANT ==='
          grep -nE 'COMISSÃO A PAGAR|Comissão a pagar|CUSTO DIESEL|Custo diesel|FATURAMENTO|Faturamento|peso|Peso|observa|Observa|conjunto|Conjunto|adiant|Adiant|logo|REPORT_LOGO|driver|motorista' /tmp/trans-source/src/lib/pdf.ts | head -700 || true
          echo '=== TOTALS/EXCEL RELEVANT ==='
          grep -nE 'COMISSÃO A PAGAR|Comissão a pagar|CUSTO DIESEL|Custo diesel|FATURAMENTO|Faturamento|peso|Peso|observa|Observa|conjunto|Conjunto|adiant|Adiant|logo|REPORT_LOGO|Excel|excel|worksheet|workbook|driver|motorista' /tmp/trans-source/src/routes/dono/totais.tsx | head -900 || true
          echo '=== REPORT SNIPPETS ==='
          for f in /tmp/trans-source/src/lib/pdf.ts /tmp/trans-source/src/routes/dono/totais.tsx; do echo "--- $f"; done
