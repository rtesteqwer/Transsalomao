name: Validate freight prices build

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reconstructed application
        run: node bootstrap.mjs
      - name: Verify feature markers
        shell: bash
        run: |
          SRC="$(ls -dt /tmp/transsalomao-build-* | head -1)"
          grep -q 'Obrigatório — toque em uma opção' "$SRC/src/routes/motorista.tsx"
          grep -q '\["ton", "trip", "cegonha", "caixinha"\]' "$SRC/src/routes/motorista.tsx"
          grep -q 'brl(t.pricePerTon)' "$SRC/src/routes/dono/viagens.tsx"
          grep -q 'grid grid-cols-2 gap-2 text-sm' "$SRC/src/routes/dono/viagens.tsx"
          echo 'feature validation OK'
