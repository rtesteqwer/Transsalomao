name: Inspect reconstructed source

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct source
        run: |
          node bootstrap.mjs
          SRC="$(ls -dt /tmp/transsalomao-build-* | head -1)"
          mkdir -p inspect-src/src/lib inspect-src/src/routes/dono inspect-src/src/components
          cp "$SRC/src/lib/api.ts" inspect-src/src/lib/api.ts
          cp "$SRC/src/lib/use-fleet.ts" inspect-src/src/lib/use-fleet.ts
          cp "$SRC/src/lib/types.ts" inspect-src/src/lib/types.ts || true
          cp "$SRC/src/lib/calc.ts" inspect-src/src/lib/calc.ts
          cp "$SRC/src/components/trip-form.tsx" inspect-src/src/components/trip-form.tsx
          cp "$SRC/src/routes/dono/route.tsx" inspect-src/src/routes/dono/route.tsx
          cp "$SRC/src/routes/dono/totais.tsx" inspect-src/src/routes/dono/totais.tsx
          cp "$SRC/src/components/owner/shell.tsx" inspect-src/src/components/owner-shell.tsx || true
          cp -r "$SRC/migrations" inspect-src/migrations
          cp "$SRC/package.json" inspect-src/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-source
          path: inspect-src
          retention-days: 1
