name: Inspect operator and report styling

on:
  push:
    paths:
      - '.github/workflows/inspect-reconstructed-source.yml'
      - 'render-overrides/**'
      - 'bootstrap.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct final source
        shell: bash
        run: |
          set -euo pipefail
          TRANS_SOURCE_DUMP=/tmp/trans-source node bootstrap.mjs
      - name: Inspect auth and report source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== AUTH FILES ==='
          find /tmp/trans-source/src -type f | grep -E 'management-auth|auth|session' | sort || true
          for f in $(find /tmp/trans-source/src -type f | grep -E 'management-auth|auth|session' | sort); do echo "--- $f"; sed -n '1,320p' "$f"; done
          echo '=== ROUTE DONO AUTH/OPERATOR REFERENCES ==='
          grep -RniE 'operatorName|Operador|operator|username|userName|logged|login|session|management' /tmp/trans-source/src/routes/dono /tmp/trans-source/src/components/owner | head -900 || true
          echo '=== TOTALS 1-330 ==='
          sed -n '1,330p' /tmp/trans-source/src/routes/dono/totais.tsx
          echo '=== PDF 430-780 ==='
          sed -n '430,780p' /tmp/trans-source/src/lib/pdf.ts
