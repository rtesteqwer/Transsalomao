name: Prepare OpenAI Key Recipient

on:
  push:
    paths:
      - 'deploy/openai-key-request.trigger'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ephemeral RSA recipient
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/salomao-openai-recipient
          node <<'NODE'
          const { generateKeyPairSync } = require('node:crypto');
          const fs = require('node:fs');
          const { publicKey, privateKey } = generateKeyPairSync('rsa', {
            modulusLength: 4096,
            publicExponent: 0x10001,
          });
          const jwk = publicKey.export({ format: 'jwk' });
          fs.writeFileSync('/tmp/salomao-openai-recipient/public-jwk.json',
            JSON.stringify({ kty: jwk.kty, n: jwk.n, e: jwk.e }));
          fs.writeFileSync('/tmp/salomao-openai-recipient/private-key.pem',
            privateKey.export({ format: 'pem', type: 'pkcs8' }),
            { mode: 0o600 });
          NODE
          test -s /tmp/salomao-openai-recipient/public-jwk.json
          test -s /tmp/salomao-openai-recipient/private-key.pem

      - name: Upload ephemeral recipient
        uses: actions/upload-artifact@v4
        with:
          name: salomao-openai-recipient
          path: /tmp/salomao-openai-recipient/
          retention-days: 1
          if-no-files-found: error
