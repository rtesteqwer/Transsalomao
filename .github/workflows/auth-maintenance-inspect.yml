name: Auth maintenance inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auth-maintenance-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull Trans Salomao production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Inspect auth schema without reading credential values
        run: |
          set -euo pipefail
          mkdir -p /tmp/auth-inspect
          cd /tmp/auth-inspect
          npm init -y >/dev/null 2>&1
          npm install --silent pg dotenv
          cat > inspect.mjs <<'NODE'
          import pg from "pg";
          import dotenv from "dotenv";
          dotenv.config({ path: process.env.GITHUB_WORKSPACE + "/.env.production.local" });
          if (!process.env.DATABASE_URL) throw new Error("DATABASE_URL missing from production environment");
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
          await client.connect();
          const q = await client.query(`
            select table_schema, table_name, column_name, data_type
            from information_schema.columns
            where table_schema not in ('pg_catalog','information_schema')
              and (
                lower(table_name) similar to '%(user|admin|management|auth|account|operator)%'
                or lower(column_name) similar to '%(password|pass|hash|login|username|role|force|change)%'
              )
            order by table_schema, table_name, ordinal_position
          `);
          const grouped = new Map();
          for (const r of q.rows) {
            const key = r.table_schema + "." + r.table_name;
            if (!grouped.has(key)) grouped.set(key, []);
            grouped.get(key).push(r.column_name + ":" + r.data_type);
          }
          for (const [table, cols] of grouped) console.log(table + " => " + cols.join(", "));
          await client.end();
          NODE
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node inspect.mjs
