name: Build Trans Salomao Android APK

on:
  push:
    branches:
      - transteste-android
    paths:
      - 'android-app/**'
      - '.github/workflows/build-transteste-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk TransSalomao.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TransSalomao-APK
          path: TransSalomao.apk
          if-no-files-found: error
          retention-days: 30
