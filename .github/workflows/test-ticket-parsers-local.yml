name: Test Ticket Parsers Local

on:
  push:
    paths:
      - 'deploy/test-ticket-parsers-local.trigger'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct current app
        shell: bash
        run: |
          set -euo pipefail
          export TRANS_SOURCE_DUMP="$RUNNER_TEMP/trans-source"
          npm run build
          echo "TRANS_SOURCE_DUMP=$TRANS_SOURCE_DUMP" >> "$GITHUB_ENV"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$TRANS_SOURCE_DUMP"
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite typescript

      - name: Run ticket parser regression tests
        shell: bash
        run: |
          set -euo pipefail
          TRANS_TEST_APP="$TRANS_SOURCE_DUMP" node --test "$GITHUB_WORKSPACE/tests/tickets.test.mjs"
