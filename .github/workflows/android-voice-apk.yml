name: Build Trans Salomao Voice APK

on:
  push:
    branches:
      - android-voice-apk
    paths:
      - 'android-voice/**'
      - '.github/workflows/android-voice-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-voice assembleDebug --stacktrace

      - name: Verify APK
        run: test -f android-voice/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TransSalomao-Voz-APK
          path: android-voice/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
