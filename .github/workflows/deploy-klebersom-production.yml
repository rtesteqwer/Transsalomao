name: Deploy Klebersom Production

on:
  push:
    paths:
      - 'deploy/deploy-klebersom.trigger'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable build with Klebersom page
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.scripts = p.scripts || {};
          p.scripts.build = 'node bootstrap-klebersom.mjs';
          fs.writeFileSync('package.json', JSON.stringify(p) + '\n');
          NODE
          grep -q 'bootstrap-klebersom.mjs' package.json

      - name: Link Trans Salomao production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "DEPLOYMENT_URL=$URL" >> "$GITHUB_ENV"
          echo "Published: $URL"

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://transsalomao.vercel.app/ > /tmp/home.html
          grep -q 'Dois aplicativos' /tmp/home.html
          grep -q 'App do motorista' /tmp/home.html
          grep -q 'Painel Gerência' /tmp/home.html
          if grep -q 'trans-salomao-background' /tmp/home.html; then
            echo 'Fundo novo reapareceu' >&2
            exit 1
          fi
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://transsalomao.vercel.app/socio-klebersom > /tmp/partner.html
          if grep -q '>Not Found<' /tmp/partner.html; then
            echo 'Rota Klebersom não publicada' >&2
            exit 1
          fi
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://transsalomao.vercel.app/dono > /tmp/dono.html
          if grep -qi 'Biometria Trans Salomão' /tmp/dono.html; then
            echo 'Biometria reapareceu' >&2
            exit 1
          fi
          echo 'KLEBERSOM_PRODUCTION_VERIFIED'
