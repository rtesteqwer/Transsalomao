name: Build Trans Salomao IA APK

on:
  push:
    paths:
      - 'android-ai/**'
      - '.github/workflows/build-transsalomao-ia-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        run: gradle -p android-ai :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: cp android-ai/app/build/outputs/apk/release/app-release.apk TransSalomao-IA-2026-09-28.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TransSalomao-IA-APK
          path: TransSalomao-IA-2026-09-28.apk
          if-no-files-found: error
