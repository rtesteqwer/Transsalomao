name: Secure OpenAI Vercel Handoff

on:
  push:
    paths:
      - 'deploy/openai-handoff.trigger'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: prj_jB9N2LQ3grttSuBALVVGp5X5gVdH
      ORG_ID: team_CmpJdXo3MzDAX3TZXFp9am5F
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "VERCEL_CREDENTIAL_OK"

      - name: Generate ephemeral handoff key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          HANDSHAKE_ID="$(cat /proc/sys/kernel/random/uuid)"
          export HANDSHAKE_ID
          echo "HANDSHAKE_ID=$HANDSHAKE_ID" >> "$GITHUB_ENV"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/openai-handoff-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/openai-handoff-private.pem -pubout -out /tmp/openai-handoff-public.pem >/dev/null 2>&1
          python - <<'PY'
          import json, os
          pem=open('/tmp/openai-handoff-public.pem','r',encoding='utf-8').read()
          with open('deploy/openai-handoff-public.json','w',encoding='utf-8') as f:
              json.dump({'id':os.environ['HANDSHAKE_ID'],'publicKeyPem':pem},f)
          PY
          git config user.name "Trans Salomao Deploy"
          git config user.email "actions@github.com"
          git add deploy/openai-handoff-public.json
          git commit -m "Publish ephemeral OpenAI handoff key [skip ci]"
          git push origin HEAD:main

      - name: Wait for encrypted OpenAI key
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/handoff-cipher.json
          for i in $(seq 1 180); do
            if curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github.raw+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/deploy/openai-handoff-cipher.json?ref=main"               -o /tmp/handoff-cipher.json; then
              if jq -e --arg id "$HANDSHAKE_ID" '.id == $id and (.ciphertext | type == "string")' /tmp/handoff-cipher.json >/dev/null 2>&1; then
                echo "ENCRYPTED_HANDOFF_RECEIVED"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::Encrypted handoff payload not received"
          exit 1

      - name: Decrypt key and configure Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.ciphertext' /tmp/handoff-cipher.json | base64 -d > /tmp/openai-handoff-cipher.bin
          openssl pkeyutl -decrypt             -inkey /tmp/openai-handoff-private.pem             -in /tmp/openai-handoff-cipher.bin             -out /tmp/openai-api-key.txt             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -pkeyopt rsa_mgf1_md:sha256
          grep -Eq '^sk-(proj-)?' /tmp/openai-api-key.txt

          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null

          npx --yes vercel@latest env rm OPENAI_API_KEY production --yes --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          cat /tmp/openai-api-key.txt | npx --yes vercel@latest env add OPENAI_API_KEY production --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null

          npx --yes vercel@latest env rm OPENAI_ASSISTANT_MODEL production --yes --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' 'gpt-5.6-sol' | npx --yes vercel@latest env add OPENAI_ASSISTANT_MODEL production --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null

          echo "VERCEL_OPENAI_ENV_CONFIGURED"

      - name: Trigger clean production redeploy and remove handoff material
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          rm -f deploy/openai-handoff-public.json deploy/openai-handoff-cipher.json
          printf '\nopenai-env-%s\n' "$(date -u +%Y%m%dT%H%M%SZ)" >> deploy/deploy-production-20260913.trigger
          git add -A deploy/openai-handoff-public.json deploy/openai-handoff-cipher.json deploy/deploy-production-20260913.trigger
          git commit -m "Activate OpenAI runtime on Trans Salomao production"
          git push origin HEAD:main
          echo "PRODUCTION_REDEPLOY_TRIGGERED"

      - name: Destroy temporary key material
        if: always()
        shell: bash
        run: |
          shred -u /tmp/openai-api-key.txt /tmp/openai-handoff-private.pem /tmp/openai-handoff-cipher.bin 2>/dev/null || true
          rm -f /tmp/handoff-cipher.json /tmp/openai-handoff-public.pem
