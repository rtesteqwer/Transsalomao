name: Validate Salomao v4 Site

on:
  push:
    branches:
      - salomao-ia-v4-actions
    paths:
      - 'assistant-v4/**'
      - 'render-overrides/apply-salomao-v4-actions.mjs'
      - 'bootstrap.mjs'
      - '.github/workflows/validate-salomao-v4.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build reconstructed production site
        run: npm run build
