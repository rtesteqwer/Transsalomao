name: Build Transporte Seguro Vix APK
# Build v0.6 pointing to Transporte Seguro Vix production URL
on:
  push:
    branches: [motorista-seguro-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        working-directory: motorista-seguro-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp motorista-seguro-android/app/build/outputs/apk/debug/app-debug.apk Transporte_Seguro_Vix_v0.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Transporte_Seguro_Vix_v0.6_APK
          path: Transporte_Seguro_Vix_v0.6.apk
          if-no-files-found: error
