name: Security Environment Audit

on:
  push:
    branches:
      - security-hardening-20260928
    paths:
      - ".github/workflows/security-env-audit.yml"
      - "deploy/security-env-audit.trigger"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Link Trans Salomao project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null

      - name: Audit and provision session secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env ls production --scope=transsalomao --token="$VERCEL_TOKEN" > /tmp/vercel-env-list.txt

          ensure_secret() {
            local key="$1"
            if grep -Eq "^[[:space:]]*${key}[[:space:]]" /tmp/vercel-env-list.txt; then
              echo "${key}=PRESENT"
              return
            fi

            value="$(openssl rand -hex 48)"
            printf '%s' "$value" | npx --yes vercel@latest env add "$key" production --sensitive --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null
            unset value
            echo "${key}=CREATED"
          }

          ensure_secret MANAGEMENT_SESSION_SECRET
          ensure_secret DRIVER_SESSION_SECRET

          if grep -Eq "^[[:space:]]*OPENAI_API_KEY[[:space:]]" /tmp/vercel-env-list.txt; then
            echo "OPENAI_API_KEY=PRESENT"
          else
            echo "OPENAI_API_KEY=MISSING"
          fi
