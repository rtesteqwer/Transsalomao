name: Restore Trans Salomao Before Background

on:
  push:
    paths:
      - 'deploy/restore-before-background.trigger'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore previous production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest promote https://transsalomao-hjz6tuj9n-transsalomao.vercel.app --yes --scope=transsalomao --token="$VERCEL_TOKEN" --timeout=5m

      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          HTML="$(curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://transsalomao.vercel.app/)"
          echo "$HTML" | grep -q 'Dois aplicativos'
          echo "$HTML" | grep -q 'App do motorista'
          echo "$HTML" | grep -q 'Painel Gerência'
          if echo "$HTML" | grep -q 'trans-salomao-background'; then
            echo 'Background novo ainda presente' >&2
            exit 1
          fi
          echo 'RESTORE_VERIFIED'
