name: Validate Trans Salomao Batch V3

on:
  push:
    paths:
      - 'deploy/deploy-production-v2.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact production base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/transsalomao-src app
          head -c 5000 deploy/release-exact-20260911/part-11b.txt > /tmp/transsalomao-src/part-11b.exact
          cat deploy/release-exact-20260911/part-00.txt deploy/release-exact-20260911/part-01.txt deploy/release-exact-20260911/part-02.txt deploy/release-exact-20260911/part-03.txt deploy/release-exact-20260911/part-04.txt deploy/release-exact-20260911/part-05a.txt deploy/release-exact-20260911/part-05b.txt deploy/release-exact-20260911/part-05c.txt deploy/release-exact-20260911/part-06.txt deploy/release-exact-20260911/part-07.txt deploy/release-exact-20260911/part-08.txt deploy/release-exact-20260911/part-09.txt deploy/release-exact-20260911/part-10.txt deploy/release-exact-20260911/part-11a.txt /tmp/transsalomao-src/part-11b.exact deploy/release-exact-20260911/part-11c.txt deploy/release-exact-20260911/part-12a.txt deploy/release-exact-20260911/part-12b.txt > /tmp/transsalomao-src/source.b64
          base64 -d /tmp/transsalomao-src/source.b64 > /tmp/transsalomao-src/source.tar.xz
          tar -xJf /tmp/transsalomao-src/source.tar.xz -C app

      - name: Apply reform v1
        shell: bash
        run: |
          set -euo pipefail
          cat deploy/reform-20260911-viagens-kml/part-{00..06}.txt | base64 -d > /tmp/transsalomao-src/reform.tar.xz
          tar -xJf /tmp/transsalomao-src/reform.tar.xz -C app

      - name: Apply reform v2
        shell: bash
        run: |
          set -euo pipefail
          cat deploy/reform-v2-overlay/part-{00..03}.txt | base64 -d > /tmp/transsalomao-src/reform-v2.tar.xz
          tar -xJf /tmp/transsalomao-src/reform-v2.tar.xz -C app

      - name: Apply lancamentos type fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d deploy/reform-v2-fix/overlay.b64 > /tmp/transsalomao-src/reform-v2-fix.tar.xz
          tar -xJf /tmp/transsalomao-src/reform-v2-fix.tar.xz -C app

      - name: Decode batch overlay
        shell: bash
        run: |
          set -euo pipefail
          wc -c deploy/reform-v3-batch/overlay.b64
          base64 -d deploy/reform-v3-batch/overlay.b64 > /tmp/transsalomao-src/batch-v3.tar.xz
          wc -c /tmp/transsalomao-src/batch-v3.tar.xz

      - name: Check batch archive
        shell: bash
        run: |
          set -euo pipefail
          xz -t /tmp/transsalomao-src/batch-v3.tar.xz
          tar -tJf /tmp/transsalomao-src/batch-v3.tar.xz

      - name: Apply batch archive
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/transsalomao-src/batch-v3.tar.xz -C app

      - name: Check batch feature
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Quantidade de viagens' app/src/components/owner/trip-form.tsx
          grep -Fq 'Lançamento em lote está disponível apenas' app/src/lib/api.ts
          grep -Fq 'viagens salvas de uma vez' app/src/routes/dono/viagens.tsx

      - name: Typecheck application source
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit --checkJs false
