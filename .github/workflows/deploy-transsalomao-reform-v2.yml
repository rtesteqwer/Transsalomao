name: Deploy Trans Salomao Commission V10

on:
  push:
    paths:
      - 'deploy/deploy-production-v2.trigger'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct application through V10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/transsalomao-src app

          head -c 5000 deploy/release-exact-20260911/part-11b.txt > /tmp/transsalomao-src/part-11b.exact
          cat deploy/release-exact-20260911/part-00.txt deploy/release-exact-20260911/part-01.txt deploy/release-exact-20260911/part-02.txt deploy/release-exact-20260911/part-03.txt deploy/release-exact-20260911/part-04.txt deploy/release-exact-20260911/part-05a.txt deploy/release-exact-20260911/part-05b.txt deploy/release-exact-20260911/part-05c.txt deploy/release-exact-20260911/part-06.txt deploy/release-exact-20260911/part-07.txt deploy/release-exact-20260911/part-08.txt deploy/release-exact-20260911/part-09.txt deploy/release-exact-20260911/part-10.txt deploy/release-exact-20260911/part-11a.txt /tmp/transsalomao-src/part-11b.exact deploy/release-exact-20260911/part-11c.txt deploy/release-exact-20260911/part-12a.txt deploy/release-exact-20260911/part-12b.txt > /tmp/transsalomao-src/source.b64
          base64 -d /tmp/transsalomao-src/source.b64 > /tmp/transsalomao-src/source.tar.xz
          tar -xJf /tmp/transsalomao-src/source.tar.xz -C app

          cat deploy/reform-20260911-viagens-kml/part-{00..06}.txt | base64 -d > /tmp/transsalomao-src/v1.tar.xz
          tar -xJf /tmp/transsalomao-src/v1.tar.xz -C app
          cat deploy/reform-v2-overlay/part-{00..03}.txt | base64 -d > /tmp/transsalomao-src/v2.tar.xz
          tar -xJf /tmp/transsalomao-src/v2.tar.xz -C app
          base64 -d deploy/reform-v2-fix/overlay.b64 > /tmp/transsalomao-src/v2fix.tar.xz
          tar -xJf /tmp/transsalomao-src/v2fix.tar.xz -C app

          cd app
          patch -p1 < ../deploy/reform-v3-batch/batch-v3.patch
          cd ..

          cat deploy/reform-v4-loading-optional/part-{00..03}.txt | base64 -d > /tmp/transsalomao-src/v4.tar.xz
          tar -xJf /tmp/transsalomao-src/v4.tar.xz -C app

          cd app
          patch -p1 < ../deploy/reform-v5-fixed-quantity-price/trans-v5.patch
          patch -p1 < ../deploy/reform-v6-mode-selector/trans-v6-mode-selector.patch
          cd ..

          cat deploy/reform-v7-overlay-small/chunk-{00..03}.txt > /tmp/transsalomao-src/v7.b64
          head -c 6000 deploy/reform-v7-overlay-small/chunk-04.txt >> /tmp/transsalomao-src/v7.b64
          cat deploy/reform-v7-overlay-small/chunk-05.txt >> /tmp/transsalomao-src/v7.b64
          base64 -d /tmp/transsalomao-src/v7.b64 > /tmp/transsalomao-src/v7.tar.xz
          tar -xJf /tmp/transsalomao-src/v7.tar.xz -C app

          cat deploy/reform-v8-excel-csv/part-{00..01}.txt > /tmp/transsalomao-src/v8.b64
          test "$(wc -c < /tmp/transsalomao-src/v8.b64)" -eq 18700
          printf '%s  %s\n' 'd73122f9773e301c2af4ee5c924e493d88f56bf429294882c8f10d7c4f5dbc94' '/tmp/transsalomao-src/v8.b64' | sha256sum -c -
          base64 -d /tmp/transsalomao-src/v8.b64 > /tmp/transsalomao-src/v8.tar.xz
          tar -xJf /tmp/transsalomao-src/v8.tar.xz -C app

          cat deploy/reform-v9-profit-simplified/chunk-00a.txt deploy/reform-v9-profit-simplified/chunk-00b.txt deploy/reform-v9-profit-simplified/chunk-00c.txt deploy/reform-v9-profit-simplified/chunk-01.txt deploy/reform-v9-profit-simplified/chunk-02.txt deploy/reform-v9-profit-simplified/chunk-03.txt > /tmp/transsalomao-src/v9.b64
          test "$(wc -c < /tmp/transsalomao-src/v9.b64)" -eq 21056
          printf '%s  %s\n' '5f7f1feb5a8177bb442842899938b3a5c59ab0c8680b1b66d95678a84636bea6' '/tmp/transsalomao-src/v9.b64' | sha256sum -c -
          base64 -d /tmp/transsalomao-src/v9.b64 > /tmp/transsalomao-src/v9.tar.xz
          tar -xJf /tmp/transsalomao-src/v9.tar.xz -C app
          cd app
          patch -p1 < ../deploy/reform-v9-profit-simplified/type-fix.patch
          cd ..

          cat deploy/reform-v10-advance-commission/part-00.txt deploy/reform-v10-advance-commission/part-01a.txt deploy/reform-v10-advance-commission/part-01b.txt deploy/reform-v10-advance-commission/part-02a.txt deploy/reform-v10-advance-commission/part-02b.txt > /tmp/transsalomao-src/v10.b64
          test "$(wc -c < /tmp/transsalomao-src/v10.b64)" -eq 25056
          printf '%s  %s\n' '0b234111a791668d4b2bd85f5893f16740f2571d9e3c728f52a2861b7ca41c79' '/tmp/transsalomao-src/v10.b64' | sha256sum -c -
          base64 -d /tmp/transsalomao-src/v10.b64 > /tmp/transsalomao-src/v10.tar.xz
          test "$(wc -c < /tmp/transsalomao-src/v10.tar.xz)" -eq 18792
          printf '%s  %s\n' '040e6a5028bcd93d4b204554693e216149f5191dc662ace6c4e8ff1c1a7e903a' '/tmp/transsalomao-src/v10.tar.xz' | sha256sum -c -
          xz -t /tmp/transsalomao-src/v10.tar.xz
          tar -xJf /tmp/transsalomao-src/v10.tar.xz -C app

          base64 -d deploy/pdf-compact-v11/overlay.b64 > /tmp/transsalomao-src/pdf-compact-v11.tar.xz
          xz -t /tmp/transsalomao-src/pdf-compact-v11.tar.xz
          tar -xJf /tmp/transsalomao-src/pdf-compact-v11.tar.xz -C app
          grep -Fq 'const tripRowHeight = 38' app/src/lib/pdf.ts
          grep -Fq 'laterPageCapacityTopStart = 246' app/src/lib/pdf.ts

          grep -Fq 'Adiantamentos de comissão' app/src/routes/dono/despesas.tsx
          grep -Fq 'Saldo de comissão' app/src/routes/dono/totais.tsx
          grep -Fq 'commissionBalance' app/src/lib/pdf.ts
          grep -Fq 'não inclui adiantamentos de comissão' app/src/routes/dono/index.tsx

      - name: Typecheck application source
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit --checkJs false
          npm run build:dev

      - name: Export PDF source for layout maintenance
        uses: actions/upload-artifact@v4
        with:
          name: transsalomao-pdf-source
          path: app/src/lib/pdf.ts
          retention-days: 1

      - name: Link production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd app
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd app
          URL="$(npx --yes vercel@latest deploy --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "DEPLOYMENT_URL=$URL" >> "$GITHUB_ENV"
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        shell: bash
        run: |
          echo "Published: $DEPLOYMENT_URL"
