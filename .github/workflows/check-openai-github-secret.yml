name: Check OpenAI GitHub Secret

on:
  push:
    paths:
      - 'deploy/check-openai-github-secret.trigger'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "OPENAI_GITHUB_SECRET_PRESENT=true"
          else
            echo "OPENAI_GITHUB_SECRET_PRESENT=false"
          fi
