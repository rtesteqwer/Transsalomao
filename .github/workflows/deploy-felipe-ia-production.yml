name: Deploy Felipe IA Cloud Production

on:
  push:
    branches: [main]
    paths:
      - "felipe-ia-cloud/**"
      - ".github/workflows/deploy-felipe-ia-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-felipe-ia-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Derive private Trans Salomao service token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 1
          fi

          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest env pull .env.transsalomao --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

          TICKET_TOKEN="$(python3 - <<'PY'
from pathlib import Path
for raw in Path(".env.transsalomao").read_text(encoding="utf-8").splitlines():
    if not raw.startswith("TICKET_TOKEN="):
        continue
    value = raw.split("=", 1)[1].strip()
    if len(value) >= 2 and value[0] == value[-1] and value[0] in {'"', "'"}:
        value = value[1:-1]
    value = value.replace("\\n", "\n").replace("\\r", "\r").replace("\\"", '"').replace("\\\\", "\\")
    print(value, end="")
    break
PY
)"
          if [ -z "$TICKET_TOKEN" ]; then
            echo "TICKET_TOKEN is missing in Trans Salomao production"
            exit 1
          fi

          DERIVED_SECRET="$(TICKET_TOKEN="$TICKET_TOKEN" node -e "console.log(require('crypto').createHash('sha256').update('felipe-ia:'+process.env.TICKET_TOKEN).digest('hex'))")"
          echo "::add-mask::$DERIVED_SECRET"
          printf 'FELIPE_DERIVED_SECRET=%s\n' "$DERIVED_SECRET" >> "$GITHUB_ENV"
          rm -f .env.transsalomao
          rm -rf .vercel

      - name: Link Felipe IA project and configure private endpoint
        working-directory: felipe-ia-cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_5J9tpQrlU27PsKdOY2N7QzBaFyn9"}' > .vercel/project.json

          npx --yes vercel@latest env rm TRANS_SALOMAO_SHARED_SECRET production --yes --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s\n' "$FELIPE_DERIVED_SECRET" | npx --yes vercel@latest env add TRANS_SALOMAO_SHARED_SECRET production --scope=transsalomao --token="$VERCEL_TOKEN"

          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy Felipe IA production
        working-directory: felipe-ia-cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --force --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "Published: $URL"
