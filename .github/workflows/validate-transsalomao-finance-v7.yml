name: Validate Trans Salomao Finance V7

on:
  push:
    paths:
      - 'deploy/validate-finance-v7.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct through V6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/transsalomao-src app
          head -c 5000 deploy/release-exact-20260911/part-11b.txt > /tmp/transsalomao-src/part-11b.exact
          cat deploy/release-exact-20260911/part-00.txt deploy/release-exact-20260911/part-01.txt deploy/release-exact-20260911/part-02.txt deploy/release-exact-20260911/part-03.txt deploy/release-exact-20260911/part-04.txt deploy/release-exact-20260911/part-05a.txt deploy/release-exact-20260911/part-05b.txt deploy/release-exact-20260911/part-05c.txt deploy/release-exact-20260911/part-06.txt deploy/release-exact-20260911/part-07.txt deploy/release-exact-20260911/part-08.txt deploy/release-exact-20260911/part-09.txt deploy/release-exact-20260911/part-10.txt deploy/release-exact-20260911/part-11a.txt /tmp/transsalomao-src/part-11b.exact deploy/release-exact-20260911/part-11c.txt deploy/release-exact-20260911/part-12a.txt deploy/release-exact-20260911/part-12b.txt | base64 -d > /tmp/transsalomao-src/source.tar.xz
          tar -xJf /tmp/transsalomao-src/source.tar.xz -C app
          cat deploy/reform-20260911-viagens-kml/part-{00..06}.txt | base64 -d > /tmp/transsalomao-src/v1.tar.xz
          tar -xJf /tmp/transsalomao-src/v1.tar.xz -C app
          cat deploy/reform-v2-overlay/part-{00..03}.txt | base64 -d > /tmp/transsalomao-src/v2.tar.xz
          tar -xJf /tmp/transsalomao-src/v2.tar.xz -C app
          base64 -d deploy/reform-v2-fix/overlay.b64 > /tmp/transsalomao-src/v2fix.tar.xz
          tar -xJf /tmp/transsalomao-src/v2fix.tar.xz -C app
          cd app
          patch -p1 < ../deploy/reform-v3-batch/batch-v3.patch
          cd ..
          cat deploy/reform-v4-loading-optional/part-{00..03}.txt | base64 -d > /tmp/transsalomao-src/v4.tar.xz
          tar -xJf /tmp/transsalomao-src/v4.tar.xz -C app
          cd app
          patch -p1 < ../deploy/reform-v5-fixed-quantity-price/trans-v5.patch
          patch -p1 < ../deploy/reform-v6-mode-selector/trans-v6-mode-selector.patch
      - name: Apply finance V7 patch
        shell: bash
        run: |
          set -euo pipefail
          cd app
          patch -p1 < ../deploy/reform-v7-finance/trans-v7-finance.patch
          test -f migrations/0008_driver_expenses.sql
          grep -Fq 'Adiantamento' src/routes/dono/despesas.tsx
          grep -Fq 'Faturamento − comissões (sem descontar diesel)' src/routes/dono/index.tsx
          grep -Fq 'Comissões por motorista' src/lib/pdf.ts
          grep -Fq 'Despesas totais' src/routes/dono/totais.tsx
      - name: Typecheck application source
        shell: bash
        run: |
          set -euo pipefail
          cd app
          npm install --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit --checkJs false
