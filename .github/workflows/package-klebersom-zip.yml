name: Package Klebersom ZIP

on:
  push:
    paths:
      - 'deploy/package-klebersom.trigger'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployable package
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts = p.scripts || {};
          p.scripts.build = 'node bootstrap-klebersom.mjs';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          rm -rf .git
          printf '%s\n' \
            'Trans Salomão — KlebersomDutra sincronizado' \
            '' \
            'Este pacote mantém a versão estável anterior ao fundo e inclui:' \
            '- acesso exclusivo do usuário KlebersomDutra;' \
            '- vínculo com o cadastro Klebersom Dutra Da Silva;' \
            '- leitura das viagens, lançamentos, abastecimentos, faturamento e comissão pelo driver_id;' \
            '- correção do cálculo de modos cegonha/caixinha no espelhamento;' \
            '- remoção do bloqueio biométrico no build atual.' \
            '' \
            'Build: npm run build' > README_KLEBERSOM.txt
          zip -qr Trans_Salomao_KlebersomDutra_Sincronizado.zip . -x 'Trans_Salomao_KlebersomDutra_Sincronizado.zip'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Trans_Salomao_KlebersomDutra_Sincronizado
          path: Trans_Salomao_KlebersomDutra_Sincronizado.zip
          compression-level: 0
          retention-days: 7
