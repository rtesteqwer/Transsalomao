name: Deploy Trans Salomao Production

on:
  push:
    branches: [main]
    paths:
      - "deploy/transsalomao-production.trigger"
      - ".github/workflows/deploy-transsalomao-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Link Trans Salomao production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 1
          fi
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy Trans Salomao production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set -a
          source .vercel/.env.production.local
          set +a
          for key in TS_JOB_A TS_JOB_B TS_JOB_C TS_JOB_D; do
            npx --yes vercel@latest env rm "$key" production --yes --scope=transsalomao --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          done
          URL="$(npx --yes vercel@latest deploy --force --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN" --build-env TS_JOB_A="$TS_MAINT_A2" --build-env TS_JOB_B="$TS_MAINT_B2" --build-env TS_JOB_C="$TS_MAINT_C2" --build-env TS_JOB_D="$TS_MAINT_D2")"
          echo "Published Trans Salomao: $URL"

      - name: Link Felipe IA Cloud project
        working-directory: felipe-ia-cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_5J9tpQrlU27PsKdOY2N7QzBaFyn9"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy Felipe IA Cloud production
        working-directory: felipe-ia-cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --force --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "Published Felipe IA Cloud: $URL"
