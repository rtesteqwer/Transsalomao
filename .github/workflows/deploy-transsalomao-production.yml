name: Deploy Trans Salomao Production

on:
  push:
    branches: [main]
    paths:
      - "deploy/transsalomao-production.trigger"
      - ".github/workflows/deploy-transsalomao-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconstruct and validate Trans Salomao
        shell: bash
        env:
          VERCEL: "1"
          VERCEL_PROJECT_PRODUCTION_URL: transsalomao.vercel.app
          TRANS_UI_ONLY_DEPLOY: "1"
        run: |
          set -euo pipefail
          export TRANS_TEST_APP="$RUNNER_TEMP/transsalomao-predeploy"
          TRANS_SOURCE_DUMP="$TRANS_TEST_APP" npm run build
          npm --prefix "$TRANS_TEST_APP" install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          TRANS_TEST_APP="$TRANS_TEST_APP" node --test tests/audit-financial-integrity.test.mjs tests/ticket-reader.test.mjs tests/tickets.test.mjs
          npm --prefix "$TRANS_TEST_APP" run build

      - name: Link Trans Salomao production project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 1
          fi
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy Trans Salomao production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --force --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "Published Trans Salomao: $URL"

      - name: Link Felipe IA Cloud project
        working-directory: felipe-ia-cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_5J9tpQrlU27PsKdOY2N7QzBaFyn9"}' > .vercel/project.json
          npx --yes vercel@latest pull --yes --environment=production --scope=transsalomao --token="$VERCEL_TOKEN"

      - name: Deploy Felipe IA Cloud production
        working-directory: felipe-ia-cloud
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --force --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "Published Felipe IA Cloud: $URL"
