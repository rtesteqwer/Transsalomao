name: Create Render Backup

on:
  push:
    branches:
      - backup-render-20260914
    paths:
      - '.github/workflows/create-render-backup.yml'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live Render source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create ZIP backup
        run: |
          rm -rf .git
          zip -qr TransSalomao_Render_Backup_2026-09-14.zip . \
            -x 'TransSalomao_Render_Backup_2026-09-14.zip'

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransSalomao_Render_Backup_2026-09-14
          path: TransSalomao_Render_Backup_2026-09-14.zip
          if-no-files-found: error
          retention-days: 30
