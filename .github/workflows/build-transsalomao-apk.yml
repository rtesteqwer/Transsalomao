name: Build Trans Salomao APK

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-transsalomao-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        working-directory: android-app
        run: gradle :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p releases
          cp android-app/app/build/outputs/apk/release/app-release.apk releases/TransSalomao-latest.apk
          cp releases/TransSalomao-latest.apk TransSalomao-2026-09-27-clean.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TransSalomao-APK
          path: TransSalomao-2026-09-27-clean.apk
          if-no-files-found: error

      - name: Publish latest APK in repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f releases/TransSalomao-latest.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "build(android): publish latest TransSalomao APK [skip ci]"
          git push
