name: Local UI Test Motorista

on:
  push:
    paths:
      - 'deploy/local-ui-test.trigger'

permissions:
  contents: read

jobs:
  test-local-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Reconstruct patched application source
        shell: bash
        run: |
          set -euo pipefail
          export TRANS_SOURCE_DUMP="$RUNNER_TEMP/trans-source"
          npm run build
          test -f "$TRANS_SOURCE_DUMP/src/routes/motorista.tsx"
          cp "$TRANS_SOURCE_DUMP/package.json" package.generated.json
          echo "SOURCE_DUMP=$TRANS_SOURCE_DUMP" >> "$GITHUB_ENV"

      - name: Verify requested motorista changes
        shell: bash
        run: |
          set -euo pipefail
          FILE="$SOURCE_DUMP/src/routes/motorista.tsx"

          if grep -Fq 'KM da carreta' "$FILE"; then
            echo "ERRO: campo KM da carreta ainda aparece no motorista"
            grep -Fn 'KM da carreta' "$FILE" || true
            exit 1
          fi

          grep -Fq 'Placa do veículo' "$FILE"
          grep -Fq 'Placa da carreta' "$FILE"
          grep -Fq 'Transportadora' "$FILE"
          grep -Fq 'Operadora' "$FILE"
          grep -Fq 'Empresa contratante' "$FILE"
          grep -Fq 'Destinatário / recebedor' "$FILE"

          grep -Fq 'maxLado = 2600' render-overrides/driver-ticket-helpers-20260924.snippet.ts
          grep -Fq 'focusedInstruction' render-overrides/salomao-ticket-reader-20260924.server.ts

          {
            echo 'STATIC_UI_OK'
            echo 'KM_DA_CARRETA=REMOVIDO'
            echo 'PLACA_VEICULO=OK'
            echo 'PLACA_CARRETA=OK'
            echo 'TRANSPORTADORA=OK'
            echo 'OPERADORA=OK'
            echo 'CONTRATANTE=OK'
            echo 'DESTINATARIO=OK'
            echo 'IMAGE_MAX_SIDE=2600'
            echo 'SECOND_FOCUSED_READ=OK'
          } | tee local-test-summary.txt

      - name: Install reconstructed app dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DUMP"
          npm install --ignore-scripts --no-audit --no-fund

      - name: Build reconstructed app
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DUMP"
          npm run build

      - name: Prepare browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DUMP"
          node -e 'const p=require("./package.json"); console.log(JSON.stringify(p.scripts||{}));' | tee "$GITHUB_WORKSPACE/generated-scripts.json"

          if node -e 'const p=require("./package.json"); process.exit(p.scripts&&p.scripts.dev?0:1)'; then
            npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
            npx playwright install --with-deps chromium

            cat > "$SOURCE_DUMP/ui-smoke.mjs" <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 1
          });

          await page.addInitScript(() => {
            localStorage.setItem("transsalomao.freightMode", "ton");
          });

          await page.route("**/api/**", async route => {
            const request = route.request();
            const url = request.url();

            if (url.includes("/api/ler-ticket") && request.method() === "GET") {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  authenticated: true,
                  username: "teste-local",
                  driverId: null,
                  available: true
                })
              });
              return;
            }

            if (url.includes("/api/ler-ticket") && request.method() === "POST") {
              await route.fulfill({
                status: 200,
                contentType: "application/json",
                body: JSON.stringify({
                  numero_ticket: "72416",
                  status: "Encerrado",
                  placa_veiculo: "MQX5F98",
                  placa_carreta: "NZE8I52",
                  produto: "FERTILIZANTE",
                  pesagem_inicial_kg: 17230,
                  pesagem_inicial_data: "13/09/2026 13:38:38",
                  pesagem_final_kg: 55700,
                  pesagem_final_data: "13/09/2026 16:51:20",
                  peso_liquido_kg: 38470,
                  peso_origem_kg: null,
                  numero_nf: null,
                  transportadora: "GIZELE APARECIDA DA ROCHA GARCIA",
                  operadora: "LOG CONSULTING",
                  contratante: null,
                  motorista: "LUIS ANTONIO FELIX DOS SANTOS",
                  cliente: null,
                  destinatario: "VPORTS",
                  anotacoes_manuscritas: null,
                  alertas: ["Teste local: confira os dados antes de lançar."]
                })
              });
              return;
            }

            await route.fulfill({
              status: 200,
              contentType: "application/json",
              body: JSON.stringify({
                ok: true,
                drivers: [],
                fleets: [],
                reports: [],
                ticket: null
              })
            });
          });

          const response = await page.goto("http://127.0.0.1:4173/motorista", {
            waitUntil: "domcontentloaded",
            timeout: 30000
          });

          await page.getByText("Acesso: teste-local", { exact: true }).waitFor({ timeout: 15000 });
          await page.waitForTimeout(500);

          const png1x1 = Buffer.from(
            "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=",
            "base64"
          );
          await page.getByLabel("Escolher da galeria").setInputFiles({
            name: "ticket-72416.png",
            mimeType: "image/png",
            buffer: png1x1
          });

          await page.getByText("Número do ticket", { exact: true }).waitFor({ timeout: 15000 });
          await page.waitForTimeout(500);

          const body = await page.locator("body").innerText().catch(() => "");
          fs.writeFileSync(process.env.GITHUB_WORKSPACE + "/motorista-body.txt", body);

          const bodyFold = body.toLocaleLowerCase("pt-BR");
          const ticketInput = await page.getByLabel("Número do ticket").inputValue();
          const weightInput = await page.getByLabel("Peso líquido (kg)").inputValue();

          const checks = {
            httpStatus: response?.status() ?? null,
            hasKmCarreta: bodyFold.includes("km da carreta"),
            hasNumeroTicket: bodyFold.includes("número do ticket"),
            hasPesoLiquido: bodyFold.includes("peso líquido (kg)"),
            hasPlacaVeiculo: bodyFold.includes("placa do veículo"),
            hasPlacaCarreta: bodyFold.includes("placa da carreta"),
            hasTransportadora: bodyFold.includes("transportadora"),
            hasOperadora: bodyFold.includes("operadora"),
            hasContratante: bodyFold.includes("empresa contratante"),
            hasDestinatario: bodyFold.includes("destinatário / recebedor"),
            hasMockTicket72416: ticketInput === "72416",
            hasMockWeight38470: weightInput === "38470"
          };
          fs.writeFileSync(
            process.env.GITHUB_WORKSPACE + "/browser-checks.json",
            JSON.stringify(checks, null, 2)
          );

          await page.screenshot({
            path: process.env.GITHUB_WORKSPACE + "/motorista-local-test.png",
            fullPage: true
          });
          await browser.close();

          if (checks.hasKmCarreta) process.exit(2);
          if (!checks.hasNumeroTicket || !checks.hasPesoLiquido || !checks.hasPlacaVeiculo ||
              !checks.hasPlacaCarreta || !checks.hasTransportadora || !checks.hasOperadora ||
              !checks.hasContratante || !checks.hasDestinatario || !checks.hasMockTicket72416 ||
              !checks.hasMockWeight38470) process.exit(3);
          EOF

            nohup npm run dev -- --host 127.0.0.1 --port 4173 > "$GITHUB_WORKSPACE/dev-server.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/dev.pid"

            for i in $(seq 1 45); do
              if curl -fsS "http://127.0.0.1:4173/motorista" >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            node "$SOURCE_DUMP/ui-smoke.mjs" || {
              echo "Browser smoke failed; preserving logs and screenshot if generated."
              cat "$GITHUB_WORKSPACE/dev-server.log" || true
              exit 1
            }
          else
            echo "NO_DEV_SCRIPT" | tee "$GITHUB_WORKSPACE/browser-test-skipped.txt"
          fi

      - name: Upload local test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transsalomao-local-ui-test
          path: |
            local-test-summary.txt
            package.generated.json
            generated-scripts.json
            browser-checks.json
            motorista-body.txt
            motorista-local-test.png
            dev-server.log
            browser-test-skipped.txt
          if-no-files-found: ignore
          retention-days: 3
