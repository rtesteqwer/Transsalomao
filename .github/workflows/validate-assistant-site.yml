name: Validate Salomao Data API

on:
  push:
    branches:
      - assistant-data-agent-v3
    paths:
      - 'assistant-v3/**'
      - 'render-overrides/apply-assistant-data-agent-v3.mjs'
      - 'bootstrap.mjs'
      - '.github/workflows/validate-assistant-site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assistant-v3/**'
      - 'render-overrides/apply-assistant-data-agent-v3.mjs'
      - 'bootstrap.mjs'
      - '.github/workflows/validate-assistant-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build reconstructed site
        run: npm run build
