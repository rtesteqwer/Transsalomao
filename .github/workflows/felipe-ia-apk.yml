name: Build Felipe IA APK

on:
  push:
    paths:
      - 'android-felipe-ia/**'
      - '.github/workflows/felipe-ia-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle -p android-felipe-ia :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android-felipe-ia/app/build/outputs/apk/debug/app-debug.apk Felipe-IA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Felipe-IA-APK
          path: Felipe-IA.apk
          if-no-files-found: error
          retention-days: 7
