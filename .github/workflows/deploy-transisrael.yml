name: Deploy independent Trans Israel
on:
  push:
    branches: [transisrael-production]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract independent source
        run: |
          mkdir site
          tar -xJf transisrael-source.tar.xz -C site
      - name: Configure independent project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node deploy.mjs
      - name: Publish Trans Israel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN"
