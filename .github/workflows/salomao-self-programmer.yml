name: Salomao IA - Programador Autonomo

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "deploy/salomao-self-programmer.trigger"

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: salomao-self-programmer
  cancel-in-progress: false

jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Claim Felipe-authorized change through OIDC
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          node scripts/salomao-self-programmer.mjs claim

      - name: Set up Java
        if: steps.claim.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.claim.outputs.found == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct reference application
        if: steps.claim.outputs.found == 'true'
        env:
          VERCEL: "1"
          VERCEL_PROJECT_PRODUCTION_URL: transsalomao.vercel.app
          TRANS_UI_ONLY_DEPLOY: "1"
        shell: bash
        run: |
          set -euo pipefail
          export TRANS_REFERENCE_APP="$RUNNER_TEMP/salomao-reference-app"
          TRANS_SOURCE_DUMP="$TRANS_REFERENCE_APP" node bootstrap.mjs
          git restore bootstrap.original.mjs
          echo "TRANS_REFERENCE_APP=$TRANS_REFERENCE_APP" >> "$GITHUB_ENV"

      - name: Program requested change
        id: programmer
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/salomao-self-programmer.mjs program

      - name: Enforce protected paths
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          CHANGED="$(git diff --name-only; git ls-files --others --exclude-standard)"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -E '^(\.github/|deploy/|\.vercel/|backup-payload/|assistant-v4/(api-assistant-auth\.ts|assistant-auth\.server\.ts|developer-mode\.server\.ts|api-assistant-programmer-proxy\.ts)|scripts/salomao-self-programmer\.mjs|.*\.env($|\.)|.*(secret|credential|token).*)'; then
            echo "Salomão tentou alterar caminho protegido."
            exit 1
          fi

      - name: Reconstruct and test web application
        if: steps.claim.outputs.found == 'true'
        env:
          VERCEL: "1"
          VERCEL_PROJECT_PRODUCTION_URL: transsalomao.vercel.app
          TRANS_UI_ONLY_DEPLOY: "1"
        shell: bash
        run: |
          set -euo pipefail
          export TRANS_TEST_APP="$RUNNER_TEMP/salomao-test-app"
          TRANS_SOURCE_DUMP="$TRANS_TEST_APP" node bootstrap.mjs
          npm --prefix "$TRANS_TEST_APP" install --ignore-scripts --no-audit --no-fund
          node --test "$TRANS_TEST_APP/tests/ticket-reader.test.mjs" "$TRANS_TEST_APP/tests/tickets.test.mjs"
          npm --prefix "$TRANS_TEST_APP" run build
          git restore bootstrap.original.mjs

      - name: Build Android when changed
        if: steps.claim.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -q '^android-voice/'; then
            gradle -p android-voice assembleDebug --stacktrace
            test -f android-voice/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Android não foi alterado."
          fi

      - name: Commit branch and open PR
        id: pr
        if: steps.claim.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_ID: ${{ steps.claim.outputs.change_id }}
          BRANCH: ${{ steps.claim.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="$(cat "$RUNNER_TEMP/salomao-summary.txt")"
          git config user.name "Salomao IA"
          git config user.email "salomao-ia@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "Salomao IA: $CHANGE_ID"
          COMMIT_SHA="$(git rev-parse HEAD)"
          git push --set-upstream origin "$BRANCH"
          BODY_FILE="$RUNNER_TEMP/pr-body.md"
          {
            echo "Alteração programada autonomamente pela Salomão IA."
            echo
            echo "Autorização: Felipe (adm_felipe), validado pelo backend e novamente via GitHub OIDC."
            echo
            echo "Resumo:"
            echo
            printf '%s\n' "$SUMMARY"
            echo
            echo "Validações: reconstrução, testes de tickets, build web e build Android quando aplicável."
          } > "$BODY_FILE"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Salomão IA: $CHANGE_ID" --body-file "$BODY_FILE")"
          {
            echo "commit_sha=$COMMIT_SHA"
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Record tested PR
        if: steps.claim.outputs.found == 'true'
        env:
          CHANGE_ID: ${{ steps.claim.outputs.change_id }}
          BRANCH: ${{ steps.claim.outputs.branch }}
          COMMIT_SHA: ${{ steps.pr.outputs.commit_sha }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="$(cat "$RUNNER_TEMP/salomao-summary.txt")"
          export SUMMARY
          SALOMAO_UPDATE_JSON="$(node -e 'process.stdout.write(JSON.stringify({id:process.env.CHANGE_ID,status:"ready",branch:process.env.BRANCH,commit_sha:process.env.COMMIT_SHA,pull_request_url:process.env.PR_URL,result_summary:process.env.SUMMARY}))')"
          export SALOMAO_UPDATE_JSON
          node scripts/salomao-self-programmer.mjs update

      - name: Merge tested PR when Felipe requested production
        id: merge
        if: steps.claim.outputs.found == 'true' && steps.claim.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --squash --delete-branch
          git switch main
          git pull --ff-only origin main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Deploy production when authorized
        id: deploy
        if: steps.claim.outputs.found == 'true' && steps.claim.outputs.publish == 'true' && steps.merge.outputs.merged == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_CmpJdXo3MzDAX3TZXFp9am5F","projectId":"prj_jB9N2LQ3grttSuBALVVGp5X5gVdH"}' > .vercel/project.json
          URL="$(npx --yes vercel@latest deploy --prod --yes --scope=transsalomao --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 https://transsalomao.vercel.app/dono >/dev/null

      - name: Record production result
        if: steps.claim.outputs.found == 'true' && steps.claim.outputs.publish == 'true' && steps.deploy.outputs.url != ''
        env:
          CHANGE_ID: ${{ steps.claim.outputs.change_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          SALOMAO_UPDATE_JSON="$(node -e 'process.stdout.write(JSON.stringify({id:process.env.CHANGE_ID,status:"published",result_summary:"Produção: "+process.env.DEPLOYMENT_URL}))')"
          export SALOMAO_UPDATE_JSON
          node scripts/salomao-self-programmer.mjs update

      - name: Record failure
        if: failure() && steps.claim.outputs.found == 'true'
        env:
          CHANGE_ID: ${{ steps.claim.outputs.change_id }}
        shell: bash
        run: |
          SALOMAO_UPDATE_JSON="$(node -e 'process.stdout.write(JSON.stringify({id:process.env.CHANGE_ID,status:"failed",error_text:"Falha no workflow de programação. Consulte o GitHub Actions para detalhes."}))')"
          export SALOMAO_UPDATE_JSON
          node scripts/salomao-self-programmer.mjs update || true
