<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transporte Seguro Vix</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#111;color:#f5f5f5}.hide{display:none}.page{padding:30px 20px;max-width:720px;margin:auto}.logo{font-size:44px;font-weight:900;color:#c9ff35}.btn,input{width:100%;border:0;border-radius:18px;background:#363636;color:#fff;padding:17px;margin:7px 0;font-size:16px}.accent{background:#c9ff35;color:#111;font-weight:800}.map{position:fixed;inset:0}.top{position:fixed;z-index:600;top:22px;width:58px;height:58px;border:0;border-radius:30px;background:#171717;color:#fff}.g{left:20px}.gps{right:20px}.sheet{position:fixed;z-index:500;left:0;right:0;bottom:0;background:#111;border-radius:28px 28px 0 0;padding:8px 20px 16px}.handle{width:90px;height:5px;background:#555;border-radius:5px;margin:5px auto 18px}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#181818;border-radius:30px;padding:7px}.nav button{border:0;background:transparent;color:#aaa;padding:9px 2px;border-radius:22px}.nav .on{background:#363636;color:#fff}.sug{background:#292929;border-radius:14px;padding:13px;margin:7px 0}.sug small{display:block;color:#aaa}.preview{height:55vh;border-radius:18px;overflow:hidden;margin:12px 0}</style></head><body><section id="roles" class="page"><div class="logo">TSV</div><h1>Transporte Seguro Vix</h1><p>v2.5 • teste</p><button class="btn accent" onclick="login('client')">Entrar como Cliente</button><button class="btn" onclick="login('driver')">Entrar como Motorista</button><button class="btn" onclick="login('admin')">Entrar como Gerência</button></section><section id="login" class="page hide"><h1 id="lt"></h1><input id="em"><input id="pw" type="password"><button class="btn accent" onclick="enter()">Entrar</button><button class="btn" onclick="show('roles')">Voltar</button></section><section id="home" class="hide"><div id="map" class="map"></div><button class="top g" onclick="userData()">G</button><button class="top gps" onclick="recenter()">◎</button><div class="sheet"><div class="handle"></div><h1 id="title">Insira seu destino</h1><p id="loc">GPS ativo • localizando…</p><button id="where" class="btn" onclick="plan()">▣ Para onde?</button><div id="online"></div><div id="nav" class="nav"></div></div></section><section id="panel" class="page hide"></section><section id="search" class="page hide"><h1>Planeje sua próxima viagem</h1><p>Origem pelo GPS e destino desejado</p><button class="btn">◷ Ir agora</button><button class="btn">● Minha localização atual</button><input id="q" placeholder="Para onde?" autocomplete="off"><div id="sugs"></div><button class="btn accent" onclick="searchNow()">Pesquisar destino</button><button class="btn" onclick="home()">Voltar ao mapa</button></section><section id="preview" class="page hide"><h1>Pré-visualizar destino</h1><p id="pn"></p><div id="pm" class="preview"></div><button class="btn accent" onclick="confirmDest()">Confirmar destino</button><button class="btn" onclick="show('search')">Voltar à busca</button></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const c={client:['cliente@motoristaseguro.app','Cliente@2026!'],driver:['motorista@motoristaseguro.app','Motorista@2026!'],admin:['admin@motoristaseguro.app','Admin@2026!']};let role='',m,mark,lat=-20.3297,lng=-40.2925,pre,pmap,t;function show(id){document.querySelectorAll('section').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide')}function login(r){role=r;show('login');lt.textContent='Entrar como '+(r==='client'?'Cliente':r==='driver'?'Motorista':'Gerência');em.value=c[r][0];pw.value=c[r][1]}function enter(){if(em.value.trim().toLowerCase()!=c[role][0]||pw.value!=c[role][1])return alert('Login inválido');if(role==='admin')return page('Gerência',['Dashboard','Corridas','Motoristas','Clientes','Financeiro','Mapa','Relatórios','Configurações']);home()}function initMap(){if(m)return;m=L.map('map',{zoomControl:false}).setView([lat,lng],17);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);mark=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:4,fillColor:'#4285f4',fillOpacity:1}).addTo(m)}function gpsStart(){navigator.geolocation&&navigator.geolocation.watchPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;loc.textContent=`GPS ao vivo • ${lat.toFixed(5)}, ${lng.toFixed(5)} • ±${Math.round(p.coords.accuracy)} m`;mark&&mark.setLatLng([lat,lng])},()=>loc.textContent='Permita localização precisa',{enableHighAccuracy:true})}function home(){show('home');setTimeout(()=>{initMap();m.invalidateSize()},50);title.textContent=role==='driver'?'Você está offline':'Insira seu destino';where.style.display=role==='client'?'block':'none';online.innerHTML=role==='driver'?'<button class="btn accent" onclick="this.textContent=this.textContent.includes(\'ONLINE\')?\'FICAR OFFLINE\':\'FICAR ONLINE\'">FICAR ONLINE</button>':'';nav.innerHTML=(role==='client'?[['⌂','Início'],['▦','Opções'],['▣','Atividade'],['⚙','Configurações']]:[['⌂','Início'],['◉','Chamadas'],['R$','Ganhos'],['⚙','Configurações']]).map((x,i)=>`<button class="${i==0?'on':''}" onclick="navTo(${i})">${x[0]}<br>${x[1]}</button>`).join('');gpsStart()}function recenter(){m&&m.setView([lat,lng],18,{animate:true})}function navTo(i){if(i===0)return home();if(role==='client'){if(i===1)return page('Opções',['Viagem','Agendar','Motorista Mulher','Para terceiros','Empresa','Senior']);if(i===2)return page('Atividade',['Av. Santa Leopoldina, nº 1200','Avaliar']);return page('Configurações',['Ajuda','Carteira','Segurança','Mensagens','Dados pessoais','Meus veículos','Pagamentos','Preferências','Privacidade e localização'])}else{if(i===1)return page('Chamadas',['Nova solicitação • R$ 38,70','ACEITAR']);if(i===2)return page('Ganhos',['Hoje • R$ 184,20','Semana • R$ 1.084,50','Mês • R$ 4.420,80']);return page('Configurações',['Dados pessoais','CNH','Documentos','Segurança','Avaliações','Preferências','Privacidade e localização'])}}function page(title,items){show('panel');panel.innerHTML=`<h1>${title}</h1>`+items.map(x=>`<button class="btn" onclick="${x==='Dados pessoais'?'userData()':'void(0)'}">${x}</button>`).join('')+'<button class="btn" onclick="home()">Voltar</button>'}function userData(){page('Dados do usuário',[`Nome: ${role==='driver'?'Motorista Teste':'Cliente Teste'}`,`E-mail: ${c[role][0]}`,`Localização: ${lat.toFixed(5)}, ${lng.toFixed(5)}`])}function plan(){show('search');q.focus()}q.addEventListener('input',()=>{clearTimeout(t);let s=q.value.trim();if(s.length<3){sugs.innerHTML='';return}t=setTimeout(()=>lookup(s),450)});async function lookup(s){sugs.innerHTML='<p>Buscando…</p>';try{let u=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&addressdetails=1&q=${encodeURIComponent(s)}&viewbox=${lng-.35},${lat+.35},${lng+.35},${lat-.35}`;let d=await (await fetch(u,{headers:{'Accept-Language':'pt-BR'}})).json();sugs.innerHTML=d.map((x,i)=>`<div class="sug" onclick='pick(${JSON.stringify(d).replace(/'/g,"&#39;")},${i})'><b>${x.name||x.display_name.split(',')[0]}</b><small>${x.display_name}</small></div>`).join('')||'<p>Nenhum destino encontrado</p>'}catch(e){sugs.innerHTML='<p>Falha na busca. Verifique a internet.</p>'}}function searchNow(){q.value.trim().length>=3?lookup(q.value.trim()):alert('Digite pelo menos 3 caracteres')}function pick(d,i){let x=d[i];pre={name:x.display_name,lat:+x.lat,lng:+x.lon};pn.textContent=pre.name;show('preview');setTimeout(()=>{pmap&&pmap.remove();pmap=L.map('pm',{zoomControl:false}).setView([pre.lat,pre.lng],17);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(pmap);L.marker([pre.lat,pre.lng]).addTo(pmap);L.circleMarker([lat,lng],{radius:7,color:'#fff',fillColor:'#4285f4',fillOpacity:1}).addTo(pmap);L.polyline([[lat,lng],[pre.lat,pre.lng]],{color:'#c9ff35',weight:4}).addTo(pmap);pmap.fitBounds([[lat,lng],[pre.lat,pre.lng]],{padding:[40,40]})},50)}function confirmDest(){home();where.textContent='▣ '+pre.name.split(',').slice(0,2).join(', ')};</script></body></html>
