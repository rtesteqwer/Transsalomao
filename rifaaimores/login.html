<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rifa Aimorés — Login</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f13;color:#fff;padding:20px}.card{width:min(420px,100%);background:#14191f;border:1px solid #2b323a;border-radius:22px;padding:28px}input{width:100%;padding:13px;margin:7px 0 14px;border-radius:10px;border:1px solid #303741;background:#0d1116;color:#fff}.btn{width:100%;border:0;padding:13px;border-radius:10px;background:#e7b85e;color:#17120a;font-weight:900;cursor:pointer}.muted{color:#98a3ae}.err{color:#ff9696;min-height:20px}</style></head><body><form class="card" id="f"><b>RIFA AIMORÉS</b><h1>Acesso administrativo</h1><p class="muted">Entre com seu usuário e senha.</p><label>Usuário<input name="username" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><div class="err" id="err"></div><button class="btn">Entrar</button></form><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();document.getElementById('err').textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget))) });if(r.ok)location.replace('/admin.html');else document.getElementById('err').textContent='Usuário ou senha inválidos.'}</script></body></html>
